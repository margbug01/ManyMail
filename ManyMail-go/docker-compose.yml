# ManyMail (Go): SMTP + API + web UI + rules in one container.
# Replaces mail-service, mail-viewer and mail-router from /opt/ManyMail; the aliases keep
# Caddy (mail-viewer:5000) and the IMAP bridge (mail-router:8090) working unchanged.
name: manymail-go
services:
  manymail:
    image: manymail-go:1
    container_name: manymail
    restart: unless-stopped
    env_file: /opt/ManyMail/.env
    environment:
      - DB_PATH=/data/manymail.db
      - SMTP_PORT=25
      - API_PORT=8080
      - VIEWER_PORT=5000
      - ROUTER_API_PORT=8090
    ports:
      - "25:25"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5000:5000"
    volumes:
      - /opt/manymail-go/data:/data
      - /opt/ManyMail/certs:/opt/ManyMail/certs:ro
    networks:
      mail-net:
        aliases: [mail-service, mail-viewer, mail-router]
networks:
  mail-net:
    external: true
    name: manymail_mail-net
