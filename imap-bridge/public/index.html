<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMAP 邮件客户端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600&family=Satisfy&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="email-privacy.js"></script>
</head>
<body>
<script>
if (new URLSearchParams(window.location.search).get('embedded') === '1') {
  document.documentElement.classList.add('embedded-mode');
}
</script>

<div class="copy-toast" id="copy-toast">已复制</div>
<div class="embedded-shell">
<div class="app">
  <div class="mobile-mail-nav">
    <button type="button" id="mobile-nav-toggle" onclick="setMobileNavigation(true)" aria-expanded="false" aria-controls="mail-navigation">☰ <span data-i18n="accountSection">邮箱账户</span></button>
    <span id="mobile-mail-context"></span>
    <span id="mobile-mail-info"></span>
  </div>
  <button type="button" class="mobile-nav-backdrop" onclick="setMobileNavigation(false)" aria-label="Close navigation" tabindex="-1"></button>
  <div class="sidebar" id="mail-navigation">
    <button type="button" class="mobile-nav-close" onclick="setMobileNavigation(false)" aria-label="Close navigation">✕</button>
    <div class="sidebar-header" data-i18n="brandTitle">ManyMail</div>
    <div class="sidebar-section">
      <div class="sidebar-section-title"><i class="bi bi-person-lines-fill"></i><span data-i18n="accountSection">邮箱账户</span></div>
      <div id="account-list"></div>
      <div class="sidebar-buttons">
        <div class="btn btn-add" onclick="showAddModal('single')"><i class="bi bi-plus-lg"></i><span data-i18n="addAccount">添加邮箱</span></div>
        <div class="btn" onclick="showAddModal('batch')"><i class="bi bi-box-arrow-in-down"></i><span data-i18n="batchImport">批量导入</span></div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="toolbar">
      <div class="folder-bar" id="folder-section" style="display:none">
        <div class="folder-group" id="folder-list" role="group"></div>
      </div>
      <select class="search-field-select" id="search-field">
        <option value="subject" data-i18n="searchSubject">主题</option>
        <option value="from" data-i18n="searchFrom">发件人</option>
        <option value="body" data-i18n="searchBody">正文</option>
        <option value="all" data-i18n="searchAll">全部</option>
      </select>
      <input type="text" id="search-input" data-i18n-ph="searchPlaceholder" placeholder="搜索发件人 / 主题...">
      <button onclick="doSearch()" data-i18n-title="searchButton" title="搜索邮件" aria-label="搜索邮件"><i class="bi bi-search"></i></button>
      <button onclick="refreshMails()" data-i18n-title="refreshButton" title="刷新列表" aria-label="刷新列表"><i class="bi bi-arrow-clockwise"></i></button>
      <button onclick="toggleSelectMode()" id="select-mode-btn" data-i18n-title="selectMode" title="多选" aria-label="多选"><i class="bi bi-check2-square"></i></button>
      <span class="mail-info" id="mail-info"></span>
    </div>
    <div class="batch-bar" id="batch-bar" style="display:none;">
      <span class="batch-count" id="batch-count">0</span>
      <button onclick="batchSelectAll()" data-i18n="selectAll">全选</button>
      <button onclick="batchDeselectAll()" data-i18n="deselectAll">取消</button>
      <button onclick="doBatchAction('read')" data-i18n="batchRead">已读</button>
      <button onclick="doBatchAction('unread')" data-i18n="batchUnread">未读</button>
      <button onclick="doBatchAction('flag')" data-i18n="batchStar">星标</button>
      <button class="danger" onclick="doBatchAction('delete')" data-i18n="batchDelete">删除</button>
    </div>
    <div class="mail-list-container">
      <div class="mail-list-pane">
        <div class="mail-list-scroll" id="mail-list">
          <div class="detail-empty"><strong>还没有连接邮箱</strong><span>添加一个 IMAP 邮箱后，即可在 ManyMail 中统一浏览邮件。</span></div>
        </div>
      </div>
      <div class="mail-detail" id="mail-detail">
        <div class="detail-empty"><strong>请选择一封邮件</strong><span>在左侧选择邮件后，可在这里查看正文、附件与收发件信息。</span></div>
      </div>
    </div>
  </div>
</div>
</div>

<!-- 添加账户弹窗 -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <h3 data-i18n="modalTitle">连接 IMAP 邮箱</h3>
    <div class="modal-tabs">
      <div class="modal-tab active" data-tab="single" onclick="switchTab('single')" data-i18n="singleTab">单个连接</div>
      <div class="modal-tab" data-tab="batch" onclick="switchTab('batch')" data-i18n="batchImport">批量导入</div>
    </div>

    <!-- 单个添加 -->
    <div class="tab-content active" id="tab-single">
      <div class="error-msg" id="modal-error"></div>
      <label data-i18n="emailLabel">邮箱地址</label>
      <input id="m-email" type="email" placeholder="you@example.com" oninput="scheduleDiscover()" onblur="runDiscover()">
      <div class="detect-status" id="detect-status"></div>
      <label data-i18n="presetLabel">邮箱类型</label>
      <select id="m-preset" onchange="onPresetChange()">
        <option value="auto" data-i18n="autoPreset">自动识别（推荐）</option>
      </select>
      <div class="custom-fields" id="custom-fields">
        <label data-i18n="hostLabel">IMAP 服务器</label>
        <input id="m-host" placeholder="imap.example.com">
        <label data-i18n="portLabel">端口</label>
        <input id="m-port" value="993">
      </div>
      <label data-i18n="passwordLabel">密码 / 应用专用密码</label>
      <input id="m-pass" type="password" data-i18n-ph="passwordPlaceholder" placeholder="密码">
      <div class="modal-buttons">
        <button onclick="hideAddModal()" data-i18n="cancel">取消</button>
        <button class="primary" onclick="doAddAccount()" data-i18n="connectButton">连接邮箱</button>
      </div>
    </div>

    <!-- 批量导入 -->
    <div class="tab-content" id="tab-batch">
      <div class="error-msg" id="batch-error"></div>
      <label data-i18n="batchLabel">账户列表（每行一个，格式: 邮箱:密码）</label>
      <textarea id="batch-input" placeholder="user1@gmail.com:password1
user2@gmx.com:password2
user3@outlook.com:password3"></textarea>
      <p class="batch-hint" data-i18n="batchHint">
        支持自动识别: Gmail, GMX, Outlook, QQ, 163, Yahoo 等邮箱的 IMAP 服务器
      </p>
      <div class="batch-results" id="batch-results"></div>
      <div class="modal-buttons">
        <button onclick="hideAddModal()" data-i18n="cancel">取消</button>
        <button class="primary" onclick="doBatchImport()" data-i18n="startImport">开始导入</button>
      </div>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>

</body>
</html>
