<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManyMail - Rules</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --primary-color: #5b9a8b; }
        body { background: #f7fbf9; color: #2f3b37; }
        .page { max-width: 1080px; margin: 28px auto; padding: 0 12px; }
        .panel { background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(91,154,139,.12); padding: 24px; margin-bottom: 20px; }
        .panel h1 { font-size: 1.35rem; } .panel h2 { font-size: 1.05rem; }
        .btn-primary { background: var(--primary-color); border-color: var(--primary-color); }
        .btn-primary:hover, .btn-primary:focus { background: #4a8a7b; border-color: #4a8a7b; }
        .form-check-input:checked { background-color: var(--primary-color); border-color: var(--primary-color); }
        .rule-row td { vertical-align: middle; font-size: .9rem; }
        .rule-off { opacity: .55; }
        .chip { display: inline-block; background: #eef5f2; color: #3d6d61; border-radius: 6px; padding: 1px 7px;
                font-size: .75rem; margin: 1px 3px 1px 0; white-space: nowrap; }
        .chip-env { background: #eef1f4; color: #5b6670; }
        .chip-bad { background: #fde8e8; color: #b42318; }
        .match-text { color: #5b6670; font-size: .82rem; word-break: break-all; }
        .action-card { border: 1px solid #e3ece8; border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fbfdfc; }
        .status-done { color: #2f7a66; } .status-retry, .status-running { color: #946200; } .status-failed { color: #b42318; }
        .result-list { max-height: 260px; overflow: auto; font-size: .85rem; }
        .empty { color: #8a9692; text-align: center; padding: 24px 0; }
        textarea.form-control { font-size: .875rem; }
    </style>
</head>
<body>
<div class="page">
    <div class="panel">
        <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-2">
            <h1 class="mb-0"><i class="bi bi-signpost-split me-2"></i><span data-i18n="title">转发与推送规则</span></h1>
            <div class="d-flex gap-2">
                <a class="btn btn-sm btn-outline-secondary" href="/"><i class="bi bi-arrow-left me-1"></i><span data-i18n="back">返回邮箱</span></a>
                <button class="btn btn-sm btn-primary" id="btn-new" type="button"><i class="bi bi-plus-lg me-1"></i><span data-i18n="newRule">新建规则</span></button>
            </div>
        </div>
        <p class="text-muted small mb-3" data-i18n="intro">新邮件到达时按顺序匹配规则，命中后执行动作：转发、推送到手机、打标签、标已读或丢进垃圾箱。外部 IMAP 邮箱的新邮件只做推送。</p>
        <div id="rules-error" class="alert alert-danger d-none"></div>
        <div class="table-responsive">
            <table class="table mb-0">
                <thead><tr>
                    <th style="width:56px" data-i18n="on">启用</th>
                    <th data-i18n="rule">规则</th>
                    <th data-i18n="actions">动作</th>
                    <th style="width:60px" data-i18n="order">顺序</th>
                    <th style="width:130px"></th>
                </tr></thead>
                <tbody id="rules-body"><tr><td colspan="5" class="empty" data-i18n="loading">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="panel">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="mb-0"><i class="bi bi-clock-history me-2"></i><span data-i18n="recent">最近路由记录</span></h2>
            <button class="btn btn-sm btn-outline-secondary" id="btn-status" type="button"><i class="bi bi-arrow-clockwise"></i></button>
        </div>
        <div class="table-responsive">
            <table class="table table-sm mb-0">
                <tbody id="status-body"><tr><td class="empty" data-i18n="loading">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="ruleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="rule-modal-title" data-i18n="editRule">编辑规则</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="editor-error" class="alert alert-danger d-none"></div>
                <div id="editor-readonly" class="alert alert-secondary d-none" data-i18n="readonly">这条规则来自 .env 里的 FORWARD_* 变量，只能在 .env 里修改。</div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small" for="f-name" data-i18n="name">名称</label>
                        <input class="form-control form-control-sm" id="f-name" maxlength="80">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small" for="f-order" data-i18n="order">顺序</label>
                        <input class="form-control form-control-sm" id="f-order" type="number" value="100">
                    </div>
                    <div class="col-md-4 d-flex align-items-end gap-3">
                        <div class="form-check form-switch mb-1"><input class="form-check-input" type="checkbox" id="f-enabled" checked><label class="form-check-label small" for="f-enabled" data-i18n="on">启用</label></div>
                        <div class="form-check form-switch mb-1"><input class="form-check-input" type="checkbox" id="f-stop"><label class="form-check-label small" for="f-stop" data-i18n="stop">命中后停止</label></div>
                    </div>
                </div>

                <h6 class="mt-4 mb-2" data-i18n="when">匹配条件 <span class="text-muted small fw-normal">（都填了的要同时满足；一格多项任一命中即可，用逗号或换行分隔）</span></h6>
                <div class="row g-3">
                    <div class="col-12 d-flex gap-3 small">
                        <span class="text-muted" data-i18n="source">来源</span>
                        <div class="form-check"><input class="form-check-input" type="checkbox" id="f-src-smtp" checked><label class="form-check-label" for="f-src-smtp" data-i18n="srcSmtp">本站收到的邮件</label></div>
                        <div class="form-check"><input class="form-check-input" type="checkbox" id="f-src-imap"><label class="form-check-label" for="f-src-imap" data-i18n="srcImap">外部 IMAP 邮箱的新邮件</label></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small" for="f-to" data-i18n="to">收件人（支持 * 通配，如 *@example.com）</label>
                        <textarea class="form-control" id="f-to" rows="2"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small" for="f-from" data-i18n="from">发件人（支持 * 通配）</label>
                        <textarea class="form-control" id="f-from" rows="2"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small" for="f-subject" data-i18n="subject">主题包含</label>
                        <textarea class="form-control" id="f-subject" rows="2"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small" for="f-body" data-i18n="body">正文包含</label>
                        <textarea class="form-control" id="f-body" rows="2"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small" for="f-regex" data-i18n="regex">主题正则（可选）</label>
                        <input class="form-control form-control-sm" id="f-regex">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small" for="f-attach" data-i18n="attach">附件</label>
                        <select class="form-select form-select-sm" id="f-attach">
                            <option value="" data-i18n="any">不限</option>
                            <option value="true" data-i18n="withAttach">有附件</option>
                            <option value="false" data-i18n="noAttach">无附件</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <div class="form-check mb-1"><input class="form-check-input" type="checkbox" id="f-spam"><label class="form-check-label small" for="f-spam" data-i18n="spam">也处理垃圾邮件</label></div>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4 mb-2">
                    <h6 class="mb-0" data-i18n="do">执行动作</h6>
                    <div class="input-group input-group-sm" style="width:auto">
                        <select class="form-select form-select-sm" id="add-action-type"></select>
                        <button class="btn btn-outline-secondary" type="button" id="btn-add-action"><i class="bi bi-plus-lg"></i></button>
                    </div>
                </div>
                <div id="actions-box"></div>

                <div id="editor-result" class="mt-3 d-none">
                    <h6 class="small text-muted mb-1" id="editor-result-title"></h6>
                    <div class="result-list" id="editor-result-body"></div>
                </div>
            </div>
            <div class="modal-footer justify-content-between">
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-secondary" type="button" id="btn-dry-run"><i class="bi bi-funnel me-1"></i><span data-i18n="dryRun">用最近 100 封试运行</span></button>
                    <button class="btn btn-sm btn-outline-secondary" type="button" id="btn-test"><i class="bi bi-bell me-1"></i><span data-i18n="testPush">发测试推送</span></button>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-dismiss="modal" data-i18n="cancel">取消</button>
                    <button class="btn btn-sm btn-primary" type="button" id="btn-save" data-i18n="save">保存</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ shared_url('i18n.js') }}"></script>
<script src="{{ asset_url('js/rules.js') }}"></script>
</body>
</html>
