<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManyMail</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600&family=Satisfy&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #5b9a8b;
            --primary-hover: #4a8a7b;
            --bg-color: #f5f9f7;
            --card-bg: #ffffff;
            --text-color: #1a2421;
            --muted-text: #4a5752;
            --border-color: #d4e4de;
            --navy: #4a7c9b;
            --success-color: #5b9a8b;
            --warning-color: #c4a35a;
            --danger-color: #c76b6b;
            --shadow: 0 2px 8px rgba(91,154,139,0.12);
            --content-max-width: 1680px;
            --radius: 10px;
            --radius-sm: 6px;
        }
        
        html {
            height: 100%;
        }
        
        body {
            background: linear-gradient(135deg, #ffffff 0%, #fafcfb 30%, #f7fbf9 50%, #fafcfb 70%, #ffffff 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-color);
            font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
        }
        
        .navbar {
            background: rgba(245,249,247,0.95) !important;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 1px 0 rgba(43,42,39,0.06);
            backdrop-filter: blur(6px);
            position: relative;
            padding: 15px 0 !important;
        }
        
        .navbar-brand {
            color: #2a5f8a !important;
            font-weight: 400;
            font-size: 1.8rem;
            letter-spacing: 2px;
            font-family: 'Satisfy', cursive;
            margin-right: 0;
        }

        /* navbar 主导航 Tab：始终可见，不随分栏隐藏 */
        .nav-tabs-group .btn {
            white-space: nowrap;
        }
        @media (max-width: 767.98px) {
            .navbar-brand {
                font-size: 1.35rem;
                letter-spacing: 1px;
            }
            .nav-tabs-group .btn {
                padding: 4px 8px;
                font-size: 0.78rem;
            }
            .nav-tabs-group .btn .nav-tab-label {
                display: none;
            }
            .nav-tabs-group .btn i {
                margin-right: 0 !important;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        
        .card-header {
            background: rgba(245,249,247,0.95);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            padding: 12px 16px;
        }
        
        .btn-primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(91,154,139,0.15);
        }
        
        .list-group-item {
            border-color: var(--border-color);
        }
        .list-group-item.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        /* 骨架屏 */
        .skeleton {
            background: linear-gradient(90deg, #e8f0ed 25%, #f5f9f7 50%, #e8f0ed 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 4px;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton-text { height: 16px; margin-bottom: 8px; }
        .skeleton-title { height: 24px; width: 60%; margin-bottom: 12px; }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted-text);
        }
        .empty-state i.d-block {
            font-size: 3.5rem;
            margin-bottom: 12px;
            opacity: 0.35;
        }
        .empty-state p {
            font-size: 0.95rem;
            margin-bottom: 18px;
        }
        .empty-state .btn-refresh {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #666;
            border: 1px solid #d0d0d0;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .empty-state .btn-refresh:hover {
            background: #f0f0f0;
            border-color: #bbb;
            color: #333;
        }
        .empty-state .btn-refresh:active {
            background: #e8e8e8;
        }
        .empty-state .btn-refresh i {
            font-size: 0.85rem;
            margin-bottom: 0;
            opacity: 0.7;
            color: inherit;
        }
        
        /* 错误状态 */
        .error-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--danger-color);
        }
        .error-state i {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
        
        /* 三栏邮件布局 */
        .mail-shell {
            width: min(100%, var(--content-max-width));
            margin: 0 auto;
        }
        @media (min-width: 992px) {
            html, body {
                height: 100%;
                overflow: hidden;
            }
            body {
                height: 100vh;
                display: flex;
                flex-direction: column;
            }
            .mail-shell {
                box-sizing: border-box;
                flex: 1 1 auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .mail-layout {
                flex: 1 1 auto;
                min-height: 0;
                overflow: hidden;
                align-items: stretch;
            }
            .mail-col {
                display: flex;
                flex-direction: column;
                min-height: 0;
                height: 100%;
            }
            .mail-col > .card {
                flex: 1 1 auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .mail-col > .card > .card-body {
                flex: 1 1 auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            /* 左栏在 offcanvas-lg 下多了一层 .offcanvas-body，弹性布局挂到它身上 */
            .mail-left > .offcanvas-body {
                flex: 1 1 auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 1rem;
                padding: 0;
                overflow: visible;
            }
            .mail-left .mail-query-card { flex: 0 0 auto; }
            /* 最近邮箱按内容高度收，不撑满剩余空间；条目多了由内部滚动接住 */
            .mail-left .mail-recent-card {
                flex: 0 1 auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .mail-left .mail-recent-card > .card-body {
                flex: 1 1 auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .mail-list-body {
                gap: 0.75rem;
            }
            .mail-recent-scroll,
            .mail-list-scroll,
            #mail-detail-content {
                flex: 1 1 auto;
                min-height: 0;
                overflow-y: auto;
                overflow-x: hidden;
                overscroll-behavior: contain;
                scrollbar-width: thin;
                scrollbar-color: rgba(74,124,155,0.32) transparent;
                scrollbar-gutter: stable both-edges;
            }
            .mail-recent-scroll::-webkit-scrollbar,
            .mail-list-scroll::-webkit-scrollbar,
            #mail-detail-content::-webkit-scrollbar {
                width: 8px;
            }
            .mail-recent-scroll::-webkit-scrollbar-track,
            .mail-list-scroll::-webkit-scrollbar-track,
            #mail-detail-content::-webkit-scrollbar-track {
                background: transparent;
            }
            .mail-recent-scroll::-webkit-scrollbar-thumb,
            .mail-list-scroll::-webkit-scrollbar-thumb,
            #mail-detail-content::-webkit-scrollbar-thumb {
                background: rgba(74,124,155,0.28);
                border-radius: 999px;
                border: 2px solid transparent;
                background-clip: padding-box;
            }
            .mail-recent-scroll::-webkit-scrollbar-thumb:hover,
            .mail-list-scroll::-webkit-scrollbar-thumb:hover,
            #mail-detail-content::-webkit-scrollbar-thumb:hover {
                background: rgba(74,124,155,0.42);
            }
            .mail-list-scroll {
                scrollbar-color: rgba(92,92,92,0.72) rgba(255,255,255,0.92);
            }
            .mail-list-scroll::-webkit-scrollbar-track {
                background: rgba(255,255,255,0.92);
            }
            .mail-list-scroll::-webkit-scrollbar-thumb {
                background: rgba(92,92,92,0.6);
            }
            .mail-list-scroll::-webkit-scrollbar-thumb:hover {
                background: rgba(48,48,48,0.78);
            }
        }
        
        /* 邮件内容保护 */
        .mail-body {
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .mail-body img {
            max-width: 100%;
            height: auto;
        }
        
        /* 邮件列表选中态 */
        .mail-item {
            cursor: pointer;
            transition: all 0.15s ease;
            overflow: hidden;
        }
        .mail-item .mail-item-body {
            min-width: 0;
        }
        .mail-item .mail-item-meta {
            flex-shrink: 0;
            white-space: nowrap;
            opacity: 0.72;
        }
        .mail-intro {
            opacity: 0.72;
        }
        /* 未读邮件样式 */
        .mail-item.mail-unread {
            border-left: 3px solid var(--navy);
            background: rgba(74,124,155,0.06);
        }
        .mail-item.mail-unread .mail-sender {
            font-weight: 700;
            color: var(--text-color);
        }
        .mail-item.mail-unread .mail-subject {
            font-weight: 600;
            color: var(--text-color);
        }
        /* 已读邮件样式 */
        .mail-item:not(.mail-unread) .mail-sender {
            font-weight: 400;
            color: var(--muted-text);
        }
        .mail-item:not(.mail-unread) .mail-subject {
            font-weight: 400;
            color: var(--muted-text);
        }
        .mail-item:hover {
            background: rgba(91,154,139,0.08);
        }
        .mail-item.active {
            background: rgba(91,154,139,0.15);
            border-left: 3px solid var(--primary-color);
        }
        .mail-item.active .mail-copy {
            background: transparent;
            border-radius: 0;
            box-decoration-break: slice;
            -webkit-box-decoration-break: slice;
            padding: 0;
        }
        .mail-item.active strong,
        .mail-item.active .mail-sender,
        .mail-item.active .mail-subject {
            font-weight: 700;
            color: var(--text-color);
        }
        .mail-item.active .mail-intro {
            opacity: 0.9;
            color: var(--muted-text);
        }
        .mail-item.active .mail-item-meta {
            opacity: 0.88;
        }
        
        /* Quill 编辑器样式 */
        .ql-container {
            min-height: 180px;
            font-family: "Noto Sans SC", system-ui, sans-serif;
            font-size: 14px;
        }
        .ql-editor {
            min-height: 180px;
        }
        .ql-toolbar.ql-snow {
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            border-color: var(--border-color);
        }
        .ql-container.ql-snow {
            border-radius: 0 0 var(--radius-sm) var(--radius-sm);
            border-color: var(--border-color);
        }
        /* 窄屏：主从下钻，列表与详情二选一全屏 */
        .mail-detail-back {
            display: none;
        }
        @media (max-width: 991.98px) {
            /* 明确抽屉宽度，避免和 col-12 的宽度规则相互覆盖 */
            #mail-left-column.offcanvas-lg {
                width: min(88vw, 380px);
            }
            .mail-layout.mobile-view-list #mail-detail-column {
                display: none;
            }
            .mail-layout.mobile-view-detail #mail-list-column {
                display: none;
            }
            .mail-detail-back {
                display: inline-flex;
                align-items: center;
                gap: 4px;
            }
            .mail-list-scroll,
            #mail-detail-content {
                max-height: none;
            }
            #imap-frame {
                min-height: calc(100vh - 140px);
            }
        }

        /* Toast 通知 */
        #toast-container {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            z-index: 1090;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            width: min(92vw, 420px);
        }
        .app-toast {
            pointer-events: auto;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: #2f3b38;
            color: #fff;
            font-size: 0.88rem;
            box-shadow: 0 6px 20px rgba(26,36,33,0.24);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .app-toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .app-toast.toast-error { background: var(--danger-color); }
        .app-toast.toast-success { background: var(--primary-color); }
        .app-toast-text {
            flex: 1 1 auto;
            min-width: 0;
            word-break: break-word;
        }
        .app-toast-action {
            flex: 0 0 auto;
            background: rgba(255,255,255,0.16);
            border: 1px solid rgba(255,255,255,0.35);
            color: #fff;
            border-radius: 999px;
            padding: 2px 12px;
            font-size: 0.82rem;
            cursor: pointer;
        }
        .app-toast-action:hover { background: rgba(255,255,255,0.28); }

        /* 验证码 badge 兼作复制按钮 */
        .code-badge {
            border: none;
            cursor: pointer;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: 0.5px;
        }
        .code-badge:hover { filter: brightness(1.08); }

        /* 最近查询邮箱 */
        .mail-recent-scroll {
            align-items: flex-start;
            align-content: flex-start;
            max-height: 34vh;
            overflow-y: auto;
        }
        .recent-pill {
            display: inline-flex;
            align-items: center;
            /* 容器被拉高时不要跟着纵向拉伸成一条长胶囊 */
            align-self: flex-start;
            max-width: 100%;
            gap: 4px;
            padding: 2px 4px 2px 10px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: #f5f9f7;
            font-size: 0.78rem;
            color: var(--muted-text);
        }
        .recent-pill-label {
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .recent-pill:hover {
            border-color: var(--primary-color);
            color: var(--text-color);
        }
        .recent-pill.recent-stale .recent-pill-label {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .recent-pill-remove {
            border: none;
            background: transparent;
            color: var(--muted-text);
            line-height: 1;
            padding: 2px 4px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .recent-pill-remove:hover { color: var(--danger-color); }

        /* 收件人 chip 输入 / 附件 chip */
        .chip-input {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            min-height: 38px;
            padding: 5px 8px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: #fff;
            cursor: text;
        }
        .chip-input.is-focused {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(91,154,139,0.15);
        }
        .chip-input input {
            flex: 1 1 120px;
            min-width: 120px;
            border: none;
            outline: none;
            font-size: 0.9rem;
            padding: 2px 0;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            max-width: 100%;
            padding: 2px 6px 2px 10px;
            border-radius: 999px;
            background: rgba(91,154,139,0.14);
            border: 1px solid rgba(91,154,139,0.35);
            font-size: 0.82rem;
            color: var(--text-color);
        }
        .chip.chip-invalid {
            background: rgba(199,107,107,0.12);
            border-color: rgba(199,107,107,0.5);
            color: var(--danger-color);
        }
        .chip-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .chip-remove {
            border: none;
            background: transparent;
            color: inherit;
            opacity: 0.6;
            line-height: 1;
            padding: 2px 4px;
            cursor: pointer;
            font-size: 0.72rem;
        }
        .chip-remove:hover { opacity: 1; }

        /* 邮件详情：收件人行与操作栏 */
        .detail-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .detail-meta-label {
            flex: 0 0 auto;
            font-weight: 600;
        }
        .detail-meta-value {
            min-width: 0;
            word-break: break-word;
        }
        .detail-self-address {
            font-weight: 700;
            color: var(--primary-color);
        }
        .detail-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .mail-plaintext {
            margin: 0;
            padding: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.82rem;
            color: var(--text-color);
        }

        /* 列表工具栏：搜索框与批量操作并排一行，空间不够才换行 */
        .mail-list-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .mail-list-toolbar #search-bar {
            flex: 1 1 150px;
            width: auto;
            min-width: 130px;
            max-width: 260px;
        }
        .mail-list-toolbar #batch-bar {
            flex: 0 0 auto;
        }
        .mail-list-toolbar #selected-count:empty {
            display: none;
        }
        @media (max-width: 991.98px) {
            .mail-list-toolbar {
                margin-bottom: 0.75rem;
            }
        }

        /* 设置弹窗里的域名列表 */
        .mail-domain-scroll {
            max-height: 40vh;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        #imap-panel {
            display: none;
        }
        #imap-panel .card {
            overflow: hidden;
        }
        #imap-panel .card-body {
            padding: 0;
        }
        #imap-frame {
            width: 100%;
            min-height: calc(100vh - 180px);
            border: 0;
            background: #fff;
        }
    </style>
    <script src="/email-privacy.js"></script>
</head>
<body>
    <nav class="navbar navbar-light sticky-top">
        <div class="container-fluid gap-2 flex-nowrap">
            <div class="d-flex align-items-center gap-2 flex-shrink-0">
                <button class="btn btn-sm btn-outline-secondary d-lg-none" type="button"
                        id="btn-left-drawer" data-bs-toggle="offcanvas" data-bs-target="#mail-left-column"
                        aria-controls="mail-left-column" data-i18n-title="openMailboxPanel" title="邮箱面板">
                    <i class="bi bi-list"></i>
                </button>
                <a class="navbar-brand d-none d-sm-inline" href="#">
                    <i class="bi bi-envelope me-2"></i>ManyMail
                </a>
            </div>

            <div class="btn-group btn-group-sm nav-tabs-group flex-shrink-1 overflow-auto" role="group">
                <button type="button" class="btn btn-primary" id="tab-inbox" onclick="switchTab('inbox')">
                    <i class="bi bi-envelope-open me-1"></i><span class="nav-tab-label" data-i18n="inbox">收件箱</span><span id="unread-badge" class="badge ms-1" style="display:none;background:var(--navy);font-size:0.7em;"></span>
                </button>
                <button type="button" class="btn btn-outline-secondary" id="tab-sent" onclick="switchTab('sent')">
                    <i class="bi bi-send me-1"></i><span class="nav-tab-label" data-i18n="sent">已发送</span>
                </button>
                <button type="button" class="btn btn-outline-secondary" id="tab-trash" onclick="switchTab('trash')">
                    <i class="bi bi-trash me-1"></i><span class="nav-tab-label" data-i18n="trash">回收站</span>
                </button>
                <button type="button" class="btn btn-outline-secondary" id="tab-imap" onclick="switchTab('imap')">
                    <i class="bi bi-diagram-3 me-1"></i><span class="nav-tab-label">IMAP</span>
                </button>
            </div>

            <div class="d-flex align-items-center gap-2 flex-shrink-0">
                <button class="btn btn-sm btn-outline-secondary" onclick="openSettings()" id="btn-settings" data-i18n-title="settings" title="设置">
                    <i class="bi bi-gear"></i>
                </button>
                <button class="btn btn-sm btn-outline-secondary" onclick="toggleLang()" id="btn-lang" title="Switch Language">
                    <i class="bi bi-translate me-1"></i><span id="lang-label">EN</span>
                </button>
                <button class="btn btn-primary btn-sm" onclick="openCompose()">
                    <i class="bi bi-pencil-square me-1"></i><span class="d-none d-md-inline" data-i18n="compose">写邮件</span>
                </button>
            </div>
        </div>
    </nav>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <div class="container-fluid py-4 px-4 mail-shell">

                 id="mail-left-column" aria-labelledby="mailLeftLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="mailLeftLabel" data-i18n="queryInbox">查询收件箱</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#mail-left-column" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body flex-column gap-3">
                    <div class="card mail-query-card">
                        <div class="card-header">
                            <i class="bi bi-search me-2"></i><span data-i18n="queryInbox">查询收件箱</span>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label" data-i18n="selectDomain">选择域名</label>
                                <select class="form-select" id="inbox-domain">
                                    <option value="" data-i18n="loading">加载中...</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" data-i18n="emailPrefix">邮箱前缀</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="inbox-prefix" data-i18n-ph="enterPrefix" placeholder="输入前缀" onkeydown="if(event.key==='Enter') queryInbox()">
                                    <span class="input-group-text" id="inbox-domain-display">@damnv.lol</span>
                                </div>
                                <small class="text-muted" data-i18n="prefixExample">例如：openai001</small>
                            </div>
                            <button class="btn btn-primary w-100" onclick="queryInbox()" id="btn-query-inbox">
                                <i class="bi bi-search me-1"></i><span data-i18n="query">查询</span>
                            </button>
                            <div id="inbox-error" class="alert alert-danger mt-3" style="display:none;"></div>
                            <div class="small text-muted mt-3" data-i18n="domainTip">输入前缀即可查询邮件，邮箱不存在会自动创建。</div>
                        </div>
                    </div>

                    <div class="card mail-recent-card" id="recent-card" style="display:none;">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span><i class="bi bi-clock-history me-2"></i><span data-i18n="recentMailboxes">最近邮箱</span></span>
                            <button class="btn btn-sm btn-outline-secondary" onclick="clearRecentMailboxes()" data-i18n-title="clearRecent" title="清空最近邮箱">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                        <div class="card-body">
                            <div id="recent-list" class="mail-recent-scroll d-flex flex-wrap gap-2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 第2栏：收件箱列表 -->
            <div class="col-12 col-lg-4 mail-col" id="mail-list-column">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span class="text-truncate me-2" id="mail-list-title">
                            <i class="bi bi-envelope-open me-2"></i><span id="mail-list-title-text" data-i18n="inbox">收件箱</span>
                            <small class="text-muted ms-1" id="mail-list-mailbox"></small>
                        </span>
                        <div class="d-flex align-items-center gap-2 flex-shrink-0">
                            <div class="form-check form-switch mb-0" data-i18n-title="autoRefreshTitle" title="每 15 秒自动刷新">
                                <input class="form-check-input" type="checkbox" id="auto-refresh-toggle" onchange="toggleAutoRefresh(this.checked)">
                                <label class="form-check-label small" for="auto-refresh-toggle" data-i18n="auto">自动</label>
                            </div>
                            <button class="btn btn-sm btn-outline-secondary" onclick="refreshCurrentTab()" id="btn-refresh-mail" disabled>
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body mail-list-body">
                        <div class="mail-list-toolbar">
                            <div class="input-group input-group-sm" id="search-bar" style="display:none;">
                                <input type="text" class="form-control" id="search-input" data-i18n-ph="searchPlaceholder" placeholder="搜索邮件..." data-i18n-title="searchHint" title="搜索发件人 / 主题 / 内容" onkeydown="if(event.key==='Enter') searchMail()">
                                <button class="btn btn-outline-secondary" onclick="searchMail()" id="btn-search">
                                    <i class="bi bi-search"></i>
                                </button>
                                <button class="btn btn-outline-secondary" onclick="clearSearch()" data-i18n-title="clearSearchTitle" title="清除搜索">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                            <div id="batch-bar" class="d-flex align-items-center gap-2" style="display:none !important;">
                                <div class="form-check mb-0">
                                    <input class="form-check-input" type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll(this.checked)">
                                    <label class="form-check-label small" for="select-all-checkbox" data-i18n="selectAll">全选</label>
                                </div>
                                <span class="small text-muted" id="selected-count"></span>
                                <button class="btn btn-sm btn-outline-danger" onclick="batchDelete()" id="btn-batch-delete" disabled>
                                    <i class="bi bi-trash me-1"></i><span data-i18n="delete">删除</span>
                                </button>
                                <button class="btn btn-sm btn-outline-secondary" onclick="batchMarkRead()" id="btn-batch-read" disabled>
                                    <i class="bi bi-check2-all me-1"></i><span data-i18n="markRead">已读</span>
                                </button>
                            </div>
                        </div>
                        <div id="mail-list" class="mail-list-scroll">
                            <div class="text-center text-muted py-4">
                                <i class="bi bi-arrow-left me-2"></i><span data-i18n="queryHint">请在左侧输入邮箱前缀查询</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 第3栏：邮件详情 -->
            <div class="col-12 col-lg-5 mail-col" id="mail-detail-column">
                <div class="card h-100" id="mail-detail-card">
                    <div class="card-header d-flex align-items-center gap-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary mail-detail-back" onclick="showMailListView()">
                            <i class="bi bi-chevron-left"></i><span data-i18n="backToList">返回列表</span>
                        </button>

                            <i class="bi bi-file-text me-2"></i><span data-i18n="mailDetail">邮件详情</span>
                        </span>
                    </div>
                    <div class="card-body">
                        <div id="mail-detail-content">
                            <div class="text-center text-muted py-5">
                                <i class="bi bi-envelope-paper" style="font-size:3rem;opacity:0.3;"></i>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12" id="imap-panel">

                    </div>
                </div>
            </div>

    <!-- 撰写/回复邮件 Modal（static backdrop：点遮罩和 Esc 都不会直接关掉草稿） -->
    <div class="modal fade" id="composeModal" tabindex="-1" aria-labelledby="composeModalLabel" aria-hidden="true"
         data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="background:rgba(245,249,247,0.95);border-bottom:1px solid var(--border-color);">
                    <h5 class="modal-title" id="composeModalLabel"><i class="bi bi-pencil-square me-2"></i><span data-i18n="composeEmail">撰写邮件</span></h5>
                    <button type="button" class="btn-close" onclick="tryCloseCompose()" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="compose-alert" class="alert" style="display:none;" role="alert"></div>
                    <div id="compose-draft-bar" class="alert alert-warning d-flex align-items-center justify-content-between gap-2 py-2" style="display:none;">
                        <span class="small" data-i18n="draftFound">检测到未发送的草稿</span>
                        <span class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-primary" onclick="restoreDraft()" data-i18n="restoreDraft">恢复</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="discardDraft()" data-i18n="discardDraft">丢弃</button>
                        </span>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" data-i18n="from">发件人</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="compose-from-prefix" data-i18n-ph="prefix" placeholder="前缀">
                            <span class="input-group-text">@</span>
                            <select class="form-select" id="compose-from-domain" style="max-width:200px;">
                                <option value="" data-i18n="loading">加载中...</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="compose-to-input" data-i18n="to">收件人</label>
                        <div class="chip-input" id="compose-to-chips" onclick="focusRecipientInput(event)">
                            <input type="text" id="compose-to-input" data-i18n-ph="toPlaceholder" placeholder="输入邮箱后回车或逗号">
                        </div>
                        <small class="text-muted" data-i18n="toHint">回车或逗号确认，格式不合法会标红</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" data-i18n="subject">主题</label>
                        <input type="text" class="form-control" id="compose-subject" data-i18n-ph="subjectPlaceholder" placeholder="邮件主题">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" data-i18n="body">正文</label>
                        <div id="compose-editor" style="min-height:200px;"></div>
                    </div>
                    <div class="mb-1">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('compose-files').click()">
                                <i class="bi bi-paperclip me-1"></i><span data-i18n="addAttachment">添加附件</span>
                            </button>
                            <small class="text-muted" id="attachment-hint"></small>
                        </div>
                        <input type="file" id="compose-files" multiple style="display:none;" onchange="onAttachmentsPicked(this)">
                        <div id="compose-attachments" class="d-flex flex-wrap gap-2"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" onclick="tryCloseCompose()" data-i18n="cancel">取消</button>
                    <button type="button" class="btn btn-primary" id="btn-send-email" onclick="sendEmail()">
                        <i class="bi bi-send me-1"></i><span data-i18n="send">发送</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

        // ---- Toast 通知 ----
        function showToast(message, options = {}) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'app-toast' + (options.type ? ` toast-${options.type}` : '');

            const text = document.createElement('span');
            text.className = 'app-toast-text';
            text.textContent = message;
            toast.appendChild(text);

            let dismissed = false;
            const dismiss = () => {
                if (dismissed) return;
                dismissed = true;
                clearTimeout(timer);
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 220);
            };

            if (options.actionLabel && typeof options.onAction === 'function') {
                const action = document.createElement('button');
                action.type = 'button';
                action.className = 'app-toast-action';
                action.textContent = options.actionLabel;
                action.onclick = () => { dismiss(); options.onAction(); };
                toast.appendChild(action);
            }

            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            const timer = setTimeout(dismiss, options.duration || (options.actionLabel ? 6000 : 3200));
            return dismiss;
        }

        async function copyText(text, event) {
            if (event) event.stopPropagation();
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    // http 环境下 navigator.clipboard 不可用，退回 execCommand
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    const ok = document.execCommand('copy');
                    ta.remove();
                    if (!ok) throw new Error('execCommand failed');
                }
                showToast(t('copied', { v: text }), { type: 'success', duration: 1800 });
            } catch (e) {

        // HTML 转义工具函数（防 XSS）
        function _escapeHtml(str) {

        // 定宽邮件比详情栏宽时的缩放比例。留 12px 余量给 body 右侧内边距，
        // 并设下限，避免超宽邮件被缩到看不清。
        function _computeBodyScale(available, natural) {
            if (!available || !natural || natural <= available + 1) return 1;
            return Math.max(available / (natural + 12), 0.4);
        }

        function _renderMailBodyIframe(iframe, mailContent, allowImages = false) {
            iframe = EmailPrivacy.freshFrame(iframe);
            EmailPrivacy.control(iframe, mailContent, allowImages, allowed => _renderMailBodyIframe(iframe, mailContent, allowed));
            const protectedContent = EmailPrivacy.prepare(mailContent, allowImages);
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            iframe.setAttribute('scrolling', 'no');
            iframe.style.overflow = 'hidden';

            iframeDoc.open();
            // color-scheme 锁 light：详情区是浅色底，放任邮件的 prefers-color-scheme: dark
            // 规则生效会变成白字浅底，读不了
            iframeDoc.write(`<!DOCTYPE html><html><head>${EmailPrivacy.head(allowImages)}<meta charset="UTF-8"><meta name="color-scheme" content="light"><base target="_blank"><style>:root{color-scheme:light;}html,body{margin:0;padding:0;background:transparent;box-sizing:border-box;}body{font-family:"Noto Sans SC",system-ui,sans-serif;font-size:14px;color:#1a2421;padding:12px;word-break:break-word;overflow-wrap:anywhere;}img{max-width:100%;height:auto;}table{max-width:100%!important;}a{color:#4a7c9b;}</style></head><body>${protectedContent}</body></html>`);
            iframeDoc.close();

            // 强制所有链接在新标签页打开（覆盖邮件中显式设置的 target）
            iframeDoc.querySelectorAll('a[href]').forEach(a => {
                a.setAttribute('target', '_blank');
                a.setAttribute('rel', 'noopener noreferrer');
            });

            // 从父页面计算尺寸（sandbox 无 allow-scripts，脚本无法在 iframe 内执行）
            const fitBody = () => {
                try {
                    const body = iframeDoc.body;
                    const doc = iframeDoc.documentElement;
                    if (!body) return;

                    // 先复位，量出内容不受约束时的自然宽度
                    body.style.transform = 'none';
                    body.style.width = 'auto';
                    const available = iframe.clientWidth || iframe.offsetWidth || 0;
                    const natural = Math.max(body.scrollWidth, doc ? doc.scrollWidth : 0);

                    // 定宽邮件（常见 600px 表格）比详情栏宽时整体缩放，
                    // 否则右边会被 overflow:hidden 直接裁掉
                    const scale = _computeBodyScale(available, natural);
                    if (scale < 1) {
                        body.style.width = natural + 'px';
                        body.style.transform = `scale(${scale})`;
                    }

                    const height = Math.max(
                        body.scrollHeight,
                        body.offsetHeight,
                        doc ? doc.scrollHeight : 0,
                        doc ? doc.offsetHeight : 0
                    );
                    iframe.style.height = Math.ceil(height * scale + 20) + 'px';
                } catch (e) {}
            };

            // 监听 iframe 内图片加载完成后重新适配
            iframeDoc.querySelectorAll('img').forEach(img => {
                if (!img.complete) {
                    img.addEventListener('load', fitBody);
                    img.addEventListener('error', fitBody);
                }
            });

            fitBody();
            setTimeout(fitBody, 200);
            setTimeout(fitBody, 800);

            // 详情栏宽度变了要重新适配（窗口缩放、桌面与窄屏互切）。
            // 只认宽度变化，否则 fitBody 改高度会把自己再触发一次。
            if (_mailBodyResizeObserver) _mailBodyResizeObserver.disconnect();
            if (window.ResizeObserver && iframe.parentElement) {
                let lastWidth = iframe.clientWidth;
                _mailBodyResizeObserver = new ResizeObserver(() => {
                    const width = iframe.clientWidth;
                    if (Math.abs(width - lastWidth) < 1) return;
                    lastWidth = width;
                    fitBody();
                });
                _mailBodyResizeObserver.observe(iframe.parentElement);
            }
        }

        function _attachmentId(att, index) {
            return encodeURIComponent(String(att.id || (att.index ?? index)));
        }

        function _formatSize(bytes) {
            const n = Number(bytes) || 0;
            if (!n) return '';
            return n >= 1024 * 1024 ? (n / 1024 / 1024).toFixed(1) + ' MB' : (n / 1024).toFixed(1) + ' KB';
        }

                    <div class="mt-2 d-flex flex-wrap gap-2">

                            const filename = att.filename || `attachment_${index}`;
                            const size = _formatSize(att.size);
                            const url = `/api/inbox/attachment/${encodeURIComponent(messageId)}/${_attachmentId(att, index)}?email=${encodeURIComponent(currentEmail)}&filename=${encodeURIComponent(filename)}`;

        async function loadDomains() {
            const domainList = document.getElementById('domain-list');
            const domainSelect = document.getElementById('inbox-domain');
            try {
                const resp = await fetch('/api/domains');
                const data = await resp.json();
                if (!data.success) {
                    domainList.innerHTML = `<div class="text-danger small">${_escapeHtml(data.message || t('loadFailed'))}</div>`;
                    return;
                }
                const domains = (data.domains || []).filter(d => d.is_active);
                activeDomains = domains.map(d => d.domain);

                // 更新域名下拉框
                const prevSelected = domainSelect.value;
                domainSelect.innerHTML = activeDomains.map(d =>
                    `<option value="${_escapeHtml(d)}">${_escapeHtml(d)}</option>`
                ).join('');
                if (activeDomains.includes(prevSelected)) {
                    domainSelect.value = prevSelected;
                }
                if (domainSelect.value) {
                    document.getElementById('inbox-domain-display').textContent = '@' + domainSelect.value;
                }

                // 更新域名管理列表
                if (activeDomains.length === 0) {
                    domainList.innerHTML = `<div class="text-muted small text-center py-2">${t('noDomains')}</div>`;
                } else {
                    domainList.innerHTML = activeDomains.map(d => `
                        <div class="d-flex justify-content-between align-items-center py-1 px-2 mb-1" style="background:#f5f9f7;border-radius:6px;">
                            <span class="small"><i class="bi bi-globe2 me-1 text-muted"></i>${_escapeHtml(d)}</span>

                            </button>
                        </div>
                    `).join('');
                }
            } catch (e) {
                domainList.innerHTML = `<div class="text-danger small">${t('loadFailed')}: ${_escapeHtml(e.message)}</div>`;
            } finally {
                // 域名可用性变了，最近邮箱的置灰状态跟着刷新
                renderRecentMailboxes();
            }
        }

        async function addDomain() {
            const input = document.getElementById('new-domain-input');
            const errorDiv = document.getElementById('domain-error');
            const domain = input.value.trim().toLowerCase();
            errorDiv.style.display = 'none';

            if (!domain) {
                errorDiv.textContent = t('enterDomainErr');
                errorDiv.style.display = 'block';
                return;
            }
            if (!domain.includes('.') || domain.length < 3) {
                errorDiv.textContent = t('domainInvalid');
                errorDiv.style.display = 'block';
                return;
            }

            const btn = document.getElementById('btn-add-domain');
            btn.disabled = true;
            try {
                const resp = await fetch('/api/domains', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain })
                });
                const data = await resp.json();
                if (data.success) {
                    input.value = '';
                    await loadDomains();
                } else {
                    errorDiv.textContent = data.message || t('loadFailed');
                    errorDiv.style.display = 'block';
                }
            } catch (e) {
                errorDiv.textContent = t('networkError') + ': ' + e.message;
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        }

                okLabel: t('disableDomainOk'),

        async function _doDeleteDomain(domain) {
            const errorDiv = document.getElementById('domain-error');
            errorDiv.style.display = 'none';
            try {
                const resp = await fetch(`/api/domains/${domain}`, { method: 'DELETE' });
                const data = await resp.json();
                if (data.success) {
                    await loadDomains();
                } else {
                    errorDiv.textContent = data.message || t('deleteFailed');
                    errorDiv.style.display = 'block';
                }
            } catch (e) {
                errorDiv.textContent = t('networkError') + ': ' + e.message;
                errorDiv.style.display = 'block';
            }
        }

                const viewport = window.visualViewport;
                const bottom = viewport ? viewport.height + viewport.offsetTop : window.innerHeight;
                const height = Math.max(180, bottom - frame.getBoundingClientRect().top - 8);
                frame.style.height = height + 'px';
                frame.style.minHeight = '0';
            } else {
                frame.style.removeProperty('height');

            const imapPanel = document.getElementById('imap-panel');

            // 切走任何一个非收件箱 Tab 都要停掉定时器，否则收件箱刷新会顶掉当前列表
            if (tab !== 'inbox' && autoRefreshTimer) {
                clearInterval(autoRefreshTimer);
                autoRefreshTimer = null;
                document.getElementById('auto-refresh-toggle').checked = false;
            }
            isSearchMode = false;
            showMailListView();
            _syncListHeader(tab);
            // IMAP 面板下左栏整个隐藏了，抽屉按钮也一并收起
            document.getElementById('btn-left-drawer').classList.toggle('d-none', tab === 'imap');

            if (tab === 'inbox') {
                tabInbox.className = 'btn btn-primary';
                tabSent.className = 'btn btn-outline-secondary';
                tabTrash.className = 'btn btn-outline-secondary';
                tabImap.className = 'btn btn-outline-secondary';
                leftColumn.style.display = '';
                listColumn.style.display = '';
                detailColumn.style.display = '';
                imapPanel.style.display = 'none';
                batchBar.style.display = currentMessages.length > 0 ? 'flex' : 'none';
                searchBar.style.display = currentEmail ? 'flex' : 'none';
                if (currentMessages.length > 0) {
                    renderMessages(currentMessages);
                } else if (currentEmail) {
                    queryInbox();

                resetMailDetail();
            } else {
                tabInbox.className = 'btn btn-outline-secondary';
                searchBar.style.display = 'none';
                document.getElementById('search-input').value = '';
                batchBar.style.display = 'none';
                if (tab === 'sent' || tab === 'trash') {
                    tabSent.className = tab === 'sent' ? 'btn btn-primary' : 'btn btn-outline-secondary';
                    tabTrash.className = tab === 'trash' ? 'btn btn-primary' : 'btn btn-outline-secondary';
                    tabImap.className = 'btn btn-outline-secondary';
                    leftColumn.style.display = '';
                    listColumn.style.display = '';
                    detailColumn.style.display = '';
                    imapPanel.style.display = 'none';
                    if (currentEmail) {
                        tab === 'sent' ? querySent() : queryTrash();

                        document.getElementById('mail-list').innerHTML = `<div class="text-center text-muted py-4"><i class="bi bi-arrow-left me-2"></i>${t('queryFirst')}</div>`;

                    resetMailDetail();
                } else {
                    tabSent.className = 'btn btn-outline-secondary';
                    tabTrash.className = 'btn btn-outline-secondary';
                    tabImap.className = 'btn btn-primary';
                    leftColumn.style.display = 'none';
                    listColumn.style.display = 'none';
                    detailColumn.style.display = 'none';
                    imapPanel.style.display = 'block';
                    ensureImapLoaded();
                }
            }
        }

        function refreshCurrentTab() {
            if (currentTab === 'inbox') queryInbox();
            else if (currentTab === 'sent') querySent();
            else if (currentTab === 'trash') queryTrash();
            else reloadImapFrame();

        async function querySent(append = false) {
            if (!currentEmail) return;
            const mailList = document.getElementById('mail-list');
            const offset = append ? currentSentMessages.length : 0;
            if (!append) mailList.innerHTML = `<div class="text-center py-3"><span class="spinner-border spinner-border-sm"></span> ${t('loading')}</div>`;

            try {
                const resp = await fetch('/api/sent/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, offset, limit: PAGE_SIZE })
                });
                const data = await resp.json();
                if (!data.success) {
                    mailList.innerHTML = `<div class="error-state"><p>${_escapeHtml(data.message || t('loadFailed'))}</p></div>`;
                    return;
                }
                currentSentTotal = data.total || data.messages.length;
                renderSentMessages(append ? currentSentMessages.concat(data.messages) : data.messages);
            } catch (e) {
                mailList.innerHTML = `<div class="error-state"><p>${t('loadFailed')}: ${_escapeHtml(e.message)}</p></div>`;
            }
        }

        function renderSentMessages(messages) {
            currentSentMessages = messages;
            const mailList = document.getElementById('mail-list');
            if (messages.length === 0) {
                mailList.innerHTML = `<div class="empty-state"><i class="bi bi-send d-block"></i><p>${t('noSentMail')}</p></div>`;
                return;
            }
            mailList.innerHTML = messages.map(msg => {
                const toStr = _escapeHtml((msg.to || []).join(', '));
                const subject = _escapeHtml(msg.subject || t('noSubject'));
                return `
                    <div class="card mb-2 mail-item" data-msg-id="${msg.id}" onclick="viewSentDetailById('${msg.id}', this)">
                        <div class="card-body py-2">
                            <div class="d-flex justify-content-between align-items-start">
                                <strong><i class="bi bi-arrow-right me-1 text-muted"></i><span class="mail-copy">${toStr}</span></strong>
                                <small class="text-muted">${new Date(msg.createdAt).toLocaleString(currentLang === 'zh' ? 'zh-CN' : 'en-US')}</small>
                            </div>
                            <div class="text-truncate"><span class="mail-copy">${subject}</span></div>
                        </div>
                    </div>`;
            }).join('');

                mailList.insertAdjacentHTML('beforeend', `<div class="text-center py-3"><button class="btn btn-outline-primary btn-sm" onclick="querySent(true)"><i class="bi bi-arrow-down-circle me-1"></i>${t('loadMore')} (${currentSentMessages.length}/${currentSentTotal})</button></div>`);

        async function viewSentDetailById(messageId, element) {
            const msg = currentSentMessages.find(item => item.id === messageId);
            if (!msg) return;
            document.querySelectorAll('.mail-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');
            showMailDetailView();
            document.getElementById('mail-detail-content').innerHTML = `<div class="text-center py-3"><span class="spinner-border spinner-border-sm"></span> ${t('loading')}</div>`;
            try {
                const resp = await fetch('/api/sent/detail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, message_id: messageId })
                });
                const data = await resp.json();
                viewSentDetail(element, data.success ? data.detail : msg);
            } catch (e) {
                viewSentDetail(element, msg);
            }
        }

        function viewSentDetail(element, msg) {
            document.querySelectorAll('.mail-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');
            const detailContent = document.getElementById('mail-detail-content');
            const toStr = _escapeHtml((msg.to || []).join(', '));
            detailContent.innerHTML = `
                <div class="mb-3"><strong>${t('from')}:</strong> ${_escapeHtml(msg.from_address || currentEmail)}</div>
                <div class="mb-3"><strong>${t('to')}:</strong> ${toStr}</div>
                <div class="mb-3"><strong>${t('subject')}:</strong> ${_escapeHtml(msg.subject || t('noSubject'))}</div>
                <div class="mb-3"><strong>${t('time')}:</strong> ${new Date(msg.createdAt).toLocaleString(currentLang === 'zh' ? 'zh-CN' : 'en-US')}</div>

                <div class="mail-body-container" style="background:#f8f9fa; padding:0; border-radius:8px; overflow:hidden;">
                    <iframe id="sent-body-frame" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" style="width:100%;border:none;min-height:200px;"></iframe>

        async function queryInbox(silent = false, append = false) {
            if (!silent && !append) resetMailDetail();
            const prefix = document.getElementById('inbox-prefix').value.trim();
            const domain = document.getElementById('inbox-domain').value;
            const email = prefix ? `${prefix}@${domain}` : '';
            const errorDiv = document.getElementById('inbox-error');
            const btn = document.getElementById('btn-query-inbox');
            const mailList = document.getElementById('mail-list');
            
            if (!prefix) {
                if (!silent) {
                    errorDiv.textContent = t('enterPrefixErr');
                    errorDiv.style.display = 'block';
                }
                return;
            }
            
            // 计算分页偏移量
            const reqOffset = append ? currentMessages.length : 0;
            
            errorDiv.style.display = 'none';
            if (!silent && !append) {
                btn.disabled = true;
                btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>${t('querying')}`;
                mailList.innerHTML = `
                    <div class="card mb-2">
                        <div class="card-body py-3">
                            <div class="skeleton skeleton-title"></div>
                            <div class="skeleton skeleton-text" style="width:80%"></div>
                            <div class="skeleton skeleton-text" style="width:60%"></div>
                        </div>
                    </div>
                    <div class="card mb-2">
                        <div class="card-body py-3">
                            <div class="skeleton skeleton-title"></div>
                            <div class="skeleton skeleton-text" style="width:75%"></div>
                        </div>
                    </div>`;
            }
            if (append) {
                const loadMoreBtn = document.getElementById('btn-load-more');
                if (loadMoreBtn) {
                    loadMoreBtn.disabled = true;
                    loadMoreBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>${t('loading')}`;
                }
            }
            
            try {
                const resp = await fetch('/api/inbox/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, offset: reqOffset, limit: PAGE_SIZE })
                });
                const data = await resp.json();
                
                if (!data.success) {
                    if (!silent) {
                        errorDiv.textContent = data.message;
                        errorDiv.style.display = 'block';
                        mailList.innerHTML = `
                            <div class="error-state">
                                <i class="bi bi-exclamation-triangle d-block"></i>
                                <p>${_escapeHtml(data.message || t('queryFailed'))}</p>
                            </div>`;
                    }
                    return;
                }
                
                currentEmail = email;
                currentTotal = data.total || 0;
                isSearchMode = false;
                if (!silent) {
                    rememberMailbox(email);
                    closeLeftDrawer();
                }
                _syncListHeader(currentTab);

                if (append) {
                    // 追加模式：合并新消息到已有列表
                    currentMessages = currentMessages.concat(data.messages);
                } else {
                    currentMessages = data.messages;
                }
                
                document.getElementById('btn-refresh-mail').disabled = false;
                currentSentMessages = [];
                currentTrashMessages = [];
                if (currentTab === 'inbox') {
                    document.getElementById('search-bar').style.display = 'flex';
                }
                
                // 静默刷新时保存当前选中和 checkbox 状态
                let activeId = null;
                let checkedIds = [];
                if (silent) {
                    const activeEl = document.querySelector('.mail-item.active');
                    if (activeEl) activeId = activeEl.dataset.msgId;
                    checkedIds = getSelectedIds();
                }
                
                renderMessages(currentMessages);
                
                // 恢复选中和 checkbox 状态
                if (silent || append) {
                    if (activeId) {
                        const el = document.querySelector(`.mail-item[data-msg-id="${activeId}"]`);
                        if (el) el.classList.add('active');
                    }
                    if (checkedIds.length > 0) {
                        checkedIds.forEach(id => {
                            const cb = document.querySelector(`.mail-checkbox[value="${id}"]`);
                            if (cb) cb.checked = true;
                        });
                        updateBatchButtons();
                    }
                }
                
            } catch (e) {
                if (!silent) {
                    errorDiv.textContent = t('networkError') + ': ' + e.message;
                    errorDiv.style.display = 'block';
                    mailList.innerHTML = `
                        <div class="error-state">
                            <i class="bi bi-exclamation-triangle d-block"></i>
                            <p>${t('networkError')}: ${_escapeHtml(e.message)}</p>
                        </div>`;
                }
            } finally {
                if (!silent) {
                    btn.disabled = false;
                    btn.innerHTML = `<i class="bi bi-search me-1"></i>${t('query')}`;
                }
            }
        }

            // 添加"加载更多"按钮（搜索结果不分页，否则会把搜索结果顶掉）

                            <i class="bi bi-arrow-down-circle me-1"></i>${t('loadMore')} (${currentMessages.length}/${currentTotal})
                        </button>
                    </div>`);
            }
            _updateUnreadBadge();
        }

        async function searchMail() {
            if (!currentEmail) return;
            const query = document.getElementById('search-input').value.trim();
            if (!query) { clearSearch(); return; }

            const mailList = document.getElementById('mail-list');
            mailList.innerHTML = `<div class="text-center py-3"><span class="spinner-border spinner-border-sm"></span> ${t('searching')}</div>`;

            try {
                const resp = await fetch('/api/inbox/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, query })
                });
                const data = await resp.json();
                if (data.success) {
                    isSearchMode = true;
                    renderMessages(data.messages);
                    if (data.messages.length === 0) {
                        mailList.innerHTML = `

                                <p>${t('noMatch')}</p>
                                <button class="btn-refresh" onclick="clearSearch()">
                                    <i class="bi bi-x-lg"></i>${t('clearSearchBtn')}
                                </button>
                            </div>`;
                    }
                } else {
                    mailList.innerHTML = `<div class="error-state"><p>${_escapeHtml(data.message || t('searchFailed'))}</p></div>`;
                }
            } catch (e) {
                mailList.innerHTML = `<div class="error-state"><p>${t('searchFailed')}: ${_escapeHtml(e.message)}</p></div>`;
            }
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            isSearchMode = false;
            renderMessages(currentMessages);
        }

        // ---- 邮件详情辅助 ----

        function _addressText(entry) {
            if (!entry) return '';
            if (typeof entry === 'string') return entry;
            return entry.address || entry.name || '';
        }

        function _renderAddressList(list) {
            const entries = (Array.isArray(list) ? list : []).map(_addressText).filter(Boolean);
            if (entries.length === 0) return '';
            return entries.map(addr => {
                // 泛解析邮箱下，标出这封信究竟是发给哪个别名的
                const isSelf = currentEmail && addr.toLowerCase() === currentEmail.toLowerCase();
                return `<span class="${isSelf ? 'detail-self-address' : ''}">${_escapeHtml(addr)}</span>`;
            }).join(', ');
        }

        function _detailMetaRow(label, valueHtml) {

            return `<div class="detail-meta-row"><span class="detail-meta-label">${label}:</span><span class="detail-meta-value">${valueHtml}</span></div>`;
        }

        function togglePlainText() {
            const htmlBox = document.getElementById('mail-body-html');
            const plainBox = document.getElementById('mail-body-plain');
            const btn = document.getElementById('btn-toggle-plain');
            if (!htmlBox || !plainBox) return;
            const showPlain = plainBox.style.display === 'none';
            plainBox.style.display = showPlain ? 'block' : 'none';
            htmlBox.style.display = showPlain ? 'none' : 'block';
            if (btn) {
                btn.innerHTML = showPlain
                    ? `<i class="bi bi-code-slash me-1"></i>${t('viewHtml')}`
                    : `<i class="bi bi-file-text me-1"></i>${t('viewPlain')}`;
            }
        }

        async function downloadEml(messageId) {
            const filename = `${(window._currentDetailMsg?.subject || messageId).slice(0, 60).replace(/[\\/:*?"<>|]/g, '_')}.eml`;
            const url = `/api/inbox/source/${encodeURIComponent(messageId)}?email=${encodeURIComponent(currentEmail)}&filename=${encodeURIComponent(filename)}`;
            try {
                const resp = await fetch(url);
                if (!resp.ok) {
                    toastError(resp.status === 404 ? t('emlUnavailable') : t('loadFailed'));
                    return;
                }
                const blob = await resp.blob();
                const objectUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = objectUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
            } catch (e) {
                toastError(t('networkError') + ': ' + e.message);
            }
        }

            if (!currentEmail) return;

            document.querySelectorAll('.mail-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');
            showMailDetailView();

        // ---- 撰写 / 回复 / 发送邮件 ----

        let composeModal = null;
        let quillEditor = null;

        function _getComposeModal() {
            if (!composeModal) {
                composeModal = new bootstrap.Modal(document.getElementById('composeModal'));
            }
            return composeModal;
        }

        function _getQuillEditor() {
            if (!quillEditor) {
                quillEditor = new Quill('#compose-editor', {
                    theme: 'snow',
                    placeholder: t('editorPlaceholder'),
                    modules: {
                        toolbar: [
                            [{ 'header': [1, 2, 3, false] }],
                            ['bold', 'italic', 'underline', 'strike'],
                            [{ 'color': [] }, { 'background': [] }],
                            [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                            ['blockquote', 'code-block'],
                            ['link', 'image'],
                            ['clean'],
                        ],
                    },
                });
                quillEditor.on('text-change', saveDraft);
            }
