name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check mail-service/ mail-viewer/app.py mail-viewer/tests/ router/ tools/

      - name: ShellCheck
        run: shellcheck -S warning install.sh tools/*.sh

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mail-service dependencies
        run: pip install -r mail-service/requirements-dev.txt

      - name: Install mail-viewer dependencies
        run: pip install -r mail-viewer/requirements.txt pytest

      - name: Run mail-service tests
        working-directory: mail-service
        run: pytest tests/ -v --tb=short

      - name: Run mail-viewer tests
        run: pytest mail-viewer/tests/ -v --tb=short

      - name: Install mail-router dependencies
        run: pip install -r router/requirements-dev.txt

      - name: Run mail-router tests
        run: pytest router/tests/ -v --tb=short

  node-tests:
    name: Node tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - mail-viewer/imap-mail-app
          - imap-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: npm test

  docker-build:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare example environment
        run: cp .env.example .env

      - name: Build images
        run: docker compose build
