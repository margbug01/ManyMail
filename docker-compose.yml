# ManyMail: one Go container (SMTP, API, web UI, rules) plus the IMAP bridge for external
# mailboxes and Caddy for HTTPS. Prebuilt multi-arch images come from GHCR; with
# `docker compose up -d --build` they are built from this checkout instead.
name: manymail

services:
  manymail:
    image: ghcr.io/margbug01/manymail:${MANYMAIL_VERSION:-latest}
    build: .
    container_name: manymail
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/manymail.db
      - SMTP_PORT=25
      - API_PORT=8080
      - VIEWER_PORT=5000
      - ROUTER_API_PORT=8090
    ports:
      - "25:25"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5000:5000"
    volumes:
      # SQLite database; set MANYMAIL_DATA to a host path to keep it outside Docker (owner uid 10001)
      - ${MANYMAIL_DATA:-manymail_data}:/data
      # STARTTLS certificate, see SMTP_TLS_CERT / SMTP_TLS_KEY in .env
      - ./certs:/opt/ManyMail/certs:ro
    networks:
      mail-net:
        # The old service names, so Caddyfiles and IMAP bridges from before the Go
        # version keep working.
        aliases: [mail-service, mail-viewer, mail-router]

  # Reads external mailboxes (Gmail, Outlook, ...) for the web UI's IMAP tab and reports
  # new mail to the rules engine for push notifications.
  imap-mail:
    image: ghcr.io/margbug01/manymail-imap-bridge:${MANYMAIL_VERSION:-latest}
    build: ./imap-bridge
    container_name: mail-imap-bridge
    restart: unless-stopped
    environment:
      - PORT=3939
      - ACCOUNTS_FILE=/data/accounts.json
      - IMAP_ACCOUNT_PERSISTENCE=${IMAP_ACCOUNT_PERSISTENCE:-encrypted}
      - IMAP_ACCOUNT_ENCRYPTION_KEY=${IMAP_ACCOUNT_ENCRYPTION_KEY:-}
      - ROUTER_URL=http://manymail:8090
      - ROUTER_API_KEY=${API_KEY:-}
    volumes:
      - imap_mail_data:/data
    expose:
      - "3939"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3939/api/accounts').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mail-net

  caddy:
    image: caddy:2-alpine
    container_name: mail-caddy
    environment:
      - MAIL_WEB_HOST=${MAIL_WEB_HOST:-localhost}
    restart: unless-stopped
    ports:
      - "80:80"
      - "${CADDY_HTTPS_BIND:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - manymail
    networks:
      - mail-net

volumes:
  manymail_data:
  imap_mail_data:
  caddy_data:
  caddy_config:

networks:
  mail-net:
    driver: bridge
